<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CoreSuryansh Orbit</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Orbitron', sans-serif; color: #fff; min-height: 100vh; overflow-x: hidden; position: relative; padding: 30px 10px; }
    
    video.bg-video { 
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
      object-fit: cover; z-index: -2; filter: brightness(0.4); 
    }

    /* Title: Dynamic Orange & Tech Hues + Typing Animation */
    .title { 
      font-size: 2.5rem; text-align: center; margin: 0 auto 30px; 
      background: linear-gradient(90deg, #ff8c00, #ff4500, #00f2fe, #ff8c00);
      background-size: 300% 100%;
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      white-space: nowrap; overflow: hidden; border-right: 3px solid rgba(255,255,255,0.7); 
      width: 18ch; margin-left: auto; margin-right: auto;
      animation: 
        typing 3.5s steps(18), 
        blink 0.6s step-end infinite alternate,
        titleHue 8s ease-in-out infinite; 
    }

    @keyframes titleHue {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes typing { from { width: 0 } to { width: 18ch } }
    @keyframes blink { 50% { border-color: transparent; } }

    .search-box { 
      padding: 14px 22px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
      outline: none; width: 90%; max-width: 480px; font-size: 1rem; margin: 0 auto 40px; 
      background: rgba(255, 255, 255, 0.1); color: white; display: block; backdrop-filter: blur(5px); 
    }

    .card-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; position: relative; z-index: 2; }

    .card { 
      width: 240px; border-radius: 20px; background: rgba(255, 255, 255, 0.05); 
      padding: 25px; text-align: center; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    .card:hover { transform: translateY(-12px); background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.4); }
    .file-name { font-size: 1.1rem; color: #fff; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
    .meta { font-size: 0.8rem; color: #b0b0b0; margin-bottom: 20px; }

    /* Cards retain their unique accent bars but the logic remains clean */
    .card.blue { border-bottom: 4px solid #4facfe; }
    .card.purple { border-bottom: 4px solid #b78df8; }
    .card.red { border-bottom: 4px solid #f85a5a; }

    /* Unlock Buttons: Dynamic Pink & Yellow Slow Remix */
    button { 
      width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; 
      background: linear-gradient(270deg, #ff007f, #ffcc00, #ff007f);
      background-size: 300% 300%;
      color: #000; 
      cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
      animation: buttonFlow 10s ease infinite;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @keyframes buttonFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
    }

    .paper-bird { 
      position: fixed; width: 24px; height: 24px; 
      background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/Paper-crane.svg') no-repeat center/contain; 
      animation: fall 12s linear infinite; opacity: 0.3; z-index: -1; 
    }

    @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); } 100% { transform: translateY(110vh) rotate(360deg); } }
    .paper-bird:nth-child(1) { left: 5%; animation-delay: 0s; }
    .paper-bird:nth-child(2) { left: 25%; animation-delay: 3s; }
    .paper-bird:nth-child(3) { left: 45%; animation-delay: 6s; }
    .paper-bird:nth-child(4) { left: 65%; animation-delay: 9s; }
    .paper-bird:nth-child(5) { left: 85%; animation-delay: 12s; }
    
    @media (max-width: 600px) { .title { font-size: 1.4rem; width: auto; animation: titleHue 8s ease-in-out infinite; border: none; } .card { width: 90%; } }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline><source src="bg.mp4" type="video/mp4"></video>
  <audio id="bg-music" autoplay loop><source src="music.mp3" type="audio/mpeg"></audio>

  <h1 class="title">CoreSuryansh Orbit</h1>
  <input class="search-box" type="text" placeholder="Search secure vault..." oninput="searchVault(this.value)"/>
  <div class="card-container" id="vault-list"></div>

  <div class="paper-bird"></div><div class="paper-bird"></div><div class="paper-bird"></div><div class="paper-bird"></div><div class="paper-bird"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SB_URL = 'https://flnxpgbftcjuwbjscelu.supabase.co';
    const SB_KEY = 'sb_publishable_8it3uTAj7ns2vFSNDCe6LA_7zZF34y-';
    
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let vaultData = [];

    async function loadVault() {
      const list = document.getElementById("vault-list");
      try {
        const { data, error } = await supabaseClient.from('folders').select('*');
        if (error) {
          list.innerHTML = `<div class="meta">Error: ${error.message}</div>`;
          return;
        }
        vaultData = data;
        render(vaultData);
      } catch (err) {
        list.innerHTML = `<div class="meta">System failure.</div>`;
      }
    }

    function render(items) {
      const list = document.getElementById("vault-list");
      list.innerHTML = "";
      if (!items || items.length === 0) {
        list.innerHTML = "<div class='meta'>No data found. Ensure your Supabase table 'folders' has rows.</div>";
        return;
      }
      items.forEach(item => {
        const name = item.folder_name || item.FolderName || "Unnamed Folder";
        const pass = item.folder_password || item.FolderPassword || item.password || "";
        const theme = item.color_theme || "blue";
        
        let link = "#";
        if (item.files) {
          link = Array.isArray(item.files) ? item.files[0] : item.files;
        }

        const card = document.createElement("div");
        card.className = `card ${theme}`;
        card.innerHTML = `
          <div class="file-name">${name}</div>
          <div class="meta">📁 SECURE VAULT</div>
          <button onclick="unlock('${pass}', '${link}')">Unlock</button>
        `;
        list.appendChild(card);
      });
    }

    function unlock(correctPin, link) {
      if (!link || link === "#") {
        alert("Encryption error: File link not found.");
        return;
      }
      
      const userPin = prompt("Enter Vault Access Pin:");
      
      if (userPin !== null && String(userPin).trim() === String(correctPin).trim()) { 
        window.open(link, '_blank'); 
      } else if (userPin !== null) { 
        alert("Access Denied: Incorrect Pin."); 
      }
    }

    function searchVault(val) {
      const filtered = vaultData.filter(i => {
        const name = i.folder_name || i.FolderName || "";
        return name.toLowerCase().includes(val.toLowerCase());
      });
      render(filtered);
    }

    window.addEventListener('click', () => {
      const audio = document.getElementById('bg-music');
      if (audio && audio.paused) audio.play();
    }, { once: true });

    loadVault();
  </script>
</body>
</html>
