<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Direx-Orbit</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 30px 10px;
    }

    /* Video Background */
    video.bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.4);
    }

    /* Typing Title Animation */
    .title {
      font-size: 2.5rem;
      text-align: center;
      margin: 0 auto 30px;
      background: linear-gradient(to right, #4facfe, #b78df8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid rgba(255,255,255,0.7);
      width: 18ch;
      animation: typing 3.5s steps(18), blink 0.6s step-end infinite alternate;
    }

    @keyframes typing { from { width: 0 } to { width: 18ch } }
    @keyframes blink { 50% { border-color: transparent; } }

    .search-box {
      padding: 14px 22px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      outline: none;
      width: 90%;
      max-width: 480px;
      font-size: 1rem;
      margin: 0 auto 40px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      display: block;
      backdrop-filter: blur(5px);
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    /* Glassmorphism Vault Card */
    .card {
      width: 240px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:hover {
      transform: translateY(-12px);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .file-name {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .meta { font-size: 0.8rem; color: #b0b0b0; margin-bottom: 20px; }

    /* Card Themes */
    .card.blue { border-bottom: 4px solid #4facfe; }
    .card.purple { border-bottom: 4px solid #b78df8; }
    .card.red { border-bottom: 4px solid #f85a5a; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: #000;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.8rem;
      transition: 0.3s;
    }

    button:hover { 
      filter: brightness(1.2); 
      box-shadow: 0 0 15px #4facfe;
    }

    /* Falling Birds */
    .paper-bird {
      position: fixed;
      width: 24px;
      height: 24px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/Paper-crane.svg') no-repeat center/contain;
      animation: fall 12s linear infinite;
      opacity: 0.3;
      z-index: -1;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    .paper-bird:nth-child(1) { left: 5%; animation-delay: 0s; }
    .paper-bird:nth-child(2) { left: 25%; animation-delay: 3s; }
    .paper-bird:nth-child(3) { left: 45%; animation-delay: 6s; }
    .paper-bird:nth-child(4) { left: 65%; animation-delay: 9s; }
    .paper-bird:nth-child(5) { left: 85%; animation-delay: 12s; }

    @media (max-width: 600px) {
      .title { font-size: 1.4rem; width: auto; animation: none; border: none; }
      .card { width: 90%; }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>

  <audio id="bg-music" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <h1 class="title">CoreSuryansh Orbit</h1>

  <input class="search-box" type="text" placeholder="Search secure vault..." oninput="searchVault(this.value)"/>

  <div class="card-container" id="vault-list">
    </div>

  <div class="paper-bird"></div>
  <div class="paper-bird"></div>
  <div class="paper-bird"></div>
  <div class="paper-bird"></div>
  <div class="paper-bird"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SB_URL = 'https://flnxpgbftcjuwbjscelu.supabase.co';
    const SB_KEY = 'sb_publishable_8it3uTAj7ns2vFSNDCe6LA_7zZF34y-';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    
    let vaultData = [];

    async function loadVault() {
      const { data, error } = await supabaseClient.from('folders').select('*');
      
      if (error) {
        console.error("Database error:", error.message);
        return;
      }

      vaultData = data;
      render(vaultData);
    }

    function render(items) {
      const list = document.getElementById("vault-list");
      list.innerHTML = "";

      if (items.length === 0) {
        list.innerHTML = "<div class='meta'>Vault is empty.</div>";
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = `card ${item.color_theme || 'blue'}`;
        
        card.innerHTML = `
          <div class="file-name">${item.folder_name}</div>
          <div class="meta">📁 ENCRYPTED FOLDER</div>
          <button onclick="unlock('${item.folder_password}', '${item.files[0]}')">Unlock</button>
        `;
        list.appendChild(card);
      });
    }

    function unlock(correct, link) {
      const pin = prompt("Enter Vault Access Pin:");
      if (pin === correct) {
        alert("Authorization Successful.");
        window.open(link, '_blank');
      } else if (pin !== null) {
        alert("Incorrect Pin.");
      }
    }

    function searchVault(val) {
      const filtered = vaultData.filter(i => 
        i.folder_name.toLowerCase().includes(val.toLowerCase())
      );
      render(filtered);
    }

    // Audio Autoplay Fix
    window.addEventListener('click', () => {
      const audio = document.getElementById('bg-music');
      if (audio && audio.paused) audio.play();
    }, { once: true });

    loadVault();
  </script>
</body>
</html>
